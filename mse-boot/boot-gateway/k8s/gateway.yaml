# 微服务模式统一入口：网关（唯一对外的 HTTP Service，NodePort 便于快速验证）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mse-gateway
  labels:
    app: mse-gateway
    app.kubernetes.io/part-of: ai-mse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mse-gateway
  template:
    metadata:
      labels:
        app: mse-gateway
        app.kubernetes.io/part-of: ai-mse
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: mse-gateway
          image: mse/boot-gateway:1.0.0   # 按实际仓库/版本修改
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 48080
          envFrom:
            - configMapRef:
                name: mse-config
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0"
            # Actuator 鉴权令牌（网关 WebFilter 与服务端同键，见 mse-micro-common.yaml）：
            # 空值 = actuator 鉴权关闭、探针匿名可过；生产接 Secret 注入
            - name: MSE_ACTUATOR_TOKEN
              value: ""
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            exec:                  # actuator 默认全保护（含 health），探针带令牌头；镜像 temurin 21-jre 自带 curl
              command: ["sh", "-c", "curl -fs -H \"X-Actuator-Token: ${MSE_ACTUATOR_TOKEN}\" http://localhost:48080/actuator/health"]
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 20   # Spring Boot 冷启动较慢，给足启动窗口
          livenessProbe:
            exec:
              command: ["sh", "-c", "curl -fs -H \"X-Actuator-Token: ${MSE_ACTUATOR_TOKEN}\" http://localhost:48080/actuator/health"]
            initialDelaySeconds: 60
            periodSeconds: 10
          lifecycle:
            preStop:               # 留缓冲给 Nacos 摘流量
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: mse-gateway
  labels:
    app: mse-gateway
spec:
  type: NodePort
  selector:
    app: mse-gateway
  ports:
    - name: http
      port: 48080
      targetPort: http
      nodePort: 30808   # 生产建议改 LoadBalancer / Ingress
