# ==================== 应用配置（Nacos 配置中心经 spring.config.import 接入） ====================
# SCA 2025.1 起 bootstrap 装载路径已移除，统一走 config-data 机制（optional:nacos:<dataId>）。
# 生效优先级：声明靠后者优先——服务专属 Data ID（${spring.application.name}.yaml）放最后。
# 原始配置留档（项目本地）：docker/nacos/config/；统一写入脚本：docker/nacos/init-configs.sh
spring:
  application:
    name: mse-platform
  config:
    import:
      - optional:nacos:mse-micro-common.yaml
      - optional:nacos:mse-micro-db.yaml
      - optional:nacos:mse-micro-dubbo.yaml
      - optional:nacos:mse-platform.yaml
  cloud:
    nacos:
      server-addr: ${MSE_NACOS_ADDR:localhost:8848}

# K8s HTTP 健康探针端点：/actuator/health（注解式鉴权不拦截无注解端点；
# Nacos 基线若配置 management.* 以基线为准）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,slowsql
